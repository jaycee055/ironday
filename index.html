<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IRONDAY — Workout Planner</title>
<meta name="theme-color" content="#0b0d0c">
<meta name="description" content="Build your own workout program or start a ready-made plan with daily tasks, phases and progress tracking.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IRONDAY">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d0c; --bg2:#121514; --card:#171b19; --card2:#1e2320; --line:#262c29;
  --text:#f2f5f3; --muted:#8f9893; --dim:#5c6560;
  --lime:#c8f43a; --lime-d:#a6cf1f; --lime-ink:#10140a; --red:#ff6b5e; --amber:#ffc24a;
  --r:20px; --r-sm:14px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --display:'Barlow Condensed',system-ui,sans-serif; --body:'Barlow',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
img{display:block;max-width:100%}
h1,h2,h3,.disp{font-family:var(--display);text-transform:uppercase;letter-spacing:.01em;margin:0;line-height:1}
h1{font-size:clamp(34px,7vw,52px);font-weight:800}
h2{font-size:26px;font-weight:800}
h3{font-size:19px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)} .lime{color:var(--lime)} .small{font-size:13px} .tiny{font-size:12px}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .wrap{flex-wrap:wrap}
.stack>*+*{margin-top:14px} .stack-lg>*+*{margin-top:24px}
.hidden{display:none!important}

/* ---------- buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 22px;border-radius:999px;font-weight:700;font-size:16px;transition:transform .12s,background .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-lime{background:var(--lime);color:var(--lime-ink)} .btn-lime:hover{background:#d6ff52}
.btn-ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)} .btn-ghost:hover{border-color:#3a423e}
.btn-danger{background:rgba(255,107,94,.12);color:var(--red);border:1px solid rgba(255,107,94,.3)}
.btn-sm{height:38px;padding:0 14px;font-size:14px}
.btn-block{width:100%}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--card2);border:1px solid var(--line)}
.icon-btn svg{width:20px;height:20px}
.field{display:block}
.field>span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
.input,select.input{width:100%;height:50px;border-radius:var(--r-sm);background:var(--card2);border:1px solid var(--line);padding:0 14px;outline:none;transition:border-color .2s}
.input:focus{border-color:var(--lime)}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 15px) 22px;background-size:5px 5px;background-repeat:no-repeat}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 16px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--muted)}
.chip.on{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.daypick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.daypick button{height:44px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:13px;color:var(--muted)}
.daypick button.on{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card-tight{padding:14px}
.badge{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;background:rgba(200,244,58,.12);color:var(--lime);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.badge.gray{background:var(--card2);color:var(--muted)} .badge.red{background:rgba(255,107,94,.12);color:var(--red)} .badge.amber{background:rgba(255,194,74,.12);color:var(--amber)}
.thumb{width:64px;height:64px;border-radius:14px;background:#fff;overflow:hidden;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.icon{background:var(--card2);display:grid;place-items:center;color:var(--lime)}
.thumb.icon svg{width:28px;height:28px}

/* ---------- auth / onboarding ---------- */
.auth{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:1fr}
.auth-hero{position:relative;min-height:100vh;min-height:100dvh;background:#000 url(img/cover.jpg) center 20%/cover no-repeat;display:flex;flex-direction:column;justify-content:flex-end}
.auth-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,13,12,.1) 0%,rgba(11,13,12,.25) 28%,rgba(11,13,12,.9) 55%,var(--bg) 80%)}
.auth-panel{position:relative;z-index:1;padding:24px 22px calc(28px + var(--safe-b));max-width:480px;width:100%;margin:0 auto}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.08em}
.brand b{color:var(--lime)}
.auth-top{position:absolute;top:calc(18px + var(--safe-t));left:22px;z-index:1}
.dots{display:flex;gap:6px;justify-content:center} .dots i{width:8px;height:8px;border-radius:9px;background:#3a423e} .dots i.on{width:24px;background:var(--lime)}
.divider{display:flex;align-items:center;gap:12px;color:var(--dim);font-size:13px} .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}

.choose-wrap{min-height:100vh;min-height:100dvh;padding:calc(24px + var(--safe-t)) 18px calc(24px + var(--safe-b));max-width:1100px;margin:0 auto}
.choice-grid{display:grid;gap:16px;margin-top:22px}
.choice{position:relative;border-radius:26px;overflow:hidden;min-height:270px;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;padding:22px;border:2px solid transparent;transition:border-color .2s,transform .15s;background:#000}
.choice:hover{border-color:var(--lime)} .choice:active{transform:scale(.99)}
.choice img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 25%;opacity:.85}
.choice::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 20%,rgba(0,0,0,.88) 78%)}
.choice>div{position:relative;z-index:1}
.choice .opt{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--lime)}
.choice h2{font-size:clamp(28px,5vw,38px);margin:6px 0 8px}
.choice p{color:#cfd6d2;font-size:15px;max-width:380px}
.choice .go{position:absolute;right:20px;bottom:22px;z-index:2;width:52px;height:52px;border-radius:50%;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center}
.choice .last{position:absolute;top:16px;left:16px;z-index:2}

/* ---------- shell ---------- */
.shell{min-height:100vh;min-height:100dvh}
.side{display:none}
.main{padding:calc(16px + var(--safe-t)) 18px calc(100px + var(--safe-b));max-width:1180px;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.avatar{width:46px;height:46px;border-radius:50%;background:#222 url(img/mirror.jpg) center 22%/cover;border:2px solid var(--lime);flex:none}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(14,17,16,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px calc(8px + var(--safe-b))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--dim);font-size:11px;font-weight:600}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--lime)}
.tab.on .ti{background:rgba(200,244,58,.12)}
.ti{width:48px;height:30px;border-radius:999px;display:grid;place-items:center;transition:background .2s}

/* ---------- home ---------- */
.home-grid{display:grid;gap:16px}
.home-grid>*,.two-col>*,.stack>*{min-width:0}
.hero-today{position:relative;border-radius:26px;overflow:hidden;background:#000;min-height:230px;padding:20px;display:flex;flex-direction:column;justify-content:space-between}
.hero-today>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 22%;opacity:.55}
.hero-today::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(0,0,0,.85) 30%,rgba(0,0,0,.15))}
.hero-today>*{position:relative;z-index:1}
.dayno{font-family:var(--display);font-weight:800;font-size:64px;line-height:.9}
.ring{--p:0;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--lime) calc(var(--p)*1%),rgba(255,255,255,.12) 0);display:grid;place-items:center;flex:none}
.ring>div{width:78px;height:78px;border-radius:50%;background:rgba(10,12,11,.92);display:grid;place-items:center;text-align:center}
.ring b{font-family:var(--display);font-size:26px;line-height:1}
.ring span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.bar{height:8px;border-radius:9px;background:var(--card2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--lime);border-radius:9px;transition:width .4s}
.task{display:flex;align-items:center;gap:14px;padding:12px;border-radius:18px;background:var(--card);border:1px solid var(--line);transition:border-color .2s,opacity .2s}
.task+.task{margin-top:10px}
.task .tmain{flex:1;min-width:0;cursor:pointer}
.task .tname{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task .tmeta{color:var(--muted);font-size:14px}
.check{width:34px;height:34px;border-radius:50%;border:2px solid #3a423e;display:grid;place-items:center;flex:none;transition:all .2s}
.check svg{width:18px;height:18px;opacity:0}
.task.done{border-color:rgba(200,244,58,.35)}
.task.done .check{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.task.done .check svg{opacity:1}
.task.done .tname{text-decoration:line-through;color:var(--muted)}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.stat b{display:block;font-family:var(--display);font-size:32px;font-weight:800;line-height:1.05}
.stat span{font-size:13px;color:var(--muted)}
.banner{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:16px;background:rgba(255,194,74,.1);border:1px solid rgba(255,194,74,.3);color:#ffe2a3}
.rest-card{text-align:center;padding:30px 18px}
.rest-card .big{font-size:46px}

/* ---------- lists / sections ---------- */
.section-h{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 12px}
.section-h a,.link{color:var(--lime);font-weight:600;font-size:14px;cursor:pointer}
.prog-card{position:relative;border-radius:22px;overflow:hidden;min-height:190px;background:#000;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer;border:1px solid var(--line);text-align:left;width:100%}
.prog-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.7}
.prog-card.white img{background:#fff;object-fit:contain;opacity:1;padding:10px 10px 70px}
.prog-card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 25%,rgba(0,0,0,.9) 80%)}
.prog-card>div{position:relative;z-index:1}
.prog-grid{display:grid;gap:14px;grid-template-columns:1fr}
.list-item{display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line);width:100%;text-align:left}
.list-item+.list-item{margin-top:10px}
.phase{display:flex;gap:14px;align-items:flex-start;padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.phase+.phase{margin-top:10px}
.phase .num{width:40px;height:40px;border-radius:12px;background:var(--card2);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px;flex:none}
.phase.cur{border-color:rgba(200,244,58,.5)} .phase.cur .num{background:var(--lime);color:var(--lime-ink)}
.phase.lock{opacity:.6}

/* ---------- library ---------- */
.group-hero{display:flex;gap:16px;align-items:center;padding:14px;border-radius:22px;background:var(--card);border:1px solid var(--line)}
.group-hero .map{width:96px;height:96px;border-radius:16px;background:#fff;overflow:hidden;flex:none}
.group-hero .map img{width:100%;height:100%;object-fit:cover}
.ex-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
.ex-card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-align:left;transition:border-color .2s}
.ex-card:hover{border-color:#3a423e}
.ex-card .img{aspect-ratio:1;background:#fff}
.ex-card .img img{width:100%;height:100%;object-fit:cover}
.ex-card .body{padding:10px 12px 12px}
.ex-card .body b{display:block;font-size:15px;line-height:1.2}
.ex-card .body span{font-size:12px;color:var(--muted)}

/* ---------- calendar ---------- */
.week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{border-radius:16px;padding:10px 0;text-align:center;background:var(--card);border:1px solid var(--line);cursor:pointer}
.wd small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700}
.wd b{display:block;font-family:var(--display);font-size:22px;margin:2px 0}
.wd i{display:block;width:6px;height:6px;border-radius:9px;margin:0 auto;background:transparent}
.wd.sel{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)} .wd.sel small{color:var(--lime-ink)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .h{text-align:center;font-size:11px;color:var(--dim);font-weight:700;text-transform:uppercase;padding-bottom:4px}
.cd{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:14px;background:var(--card);border:1px solid transparent;cursor:pointer;position:relative}
.cd.out{background:transparent;color:#2f3532;cursor:default}
.cd.rest{color:var(--dim)}
.cd.work{border-color:#3a423e}
.cd.done{background:var(--lime);color:var(--lime-ink)}
.cd.part{background:rgba(200,244,58,.18);color:var(--lime)}
.cd.miss{border-color:rgba(255,107,94,.45);color:var(--red)}
.cd.today{outline:2px solid var(--text);outline-offset:1px}
.cd.sel{box-shadow:0 0 0 2px var(--lime) inset}
.cd em{font-style:normal;font-size:9px;font-weight:700;opacity:.8;margin-top:1px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* ---------- builder ---------- */
.steps{display:flex;gap:6px;margin:16px 0 20px}
.steps i{flex:1;height:5px;border-radius:9px;background:var(--card2)} .steps i.on{background:var(--lime)}
.tag-day{display:flex;align-items:center;justify-content:space-between;padding:14px 0 8px}
.mini-task{display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;background:var(--card2);border:1px solid var(--line)}
.mini-task+.mini-task{margin-top:8px}
.mini-task .thumb{width:46px;height:46px;border-radius:10px}
.num-in{width:56px;height:36px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);text-align:center;outline:none}
.num-in:focus{border-color:var(--lime)}
.sticky-foot{position:sticky;bottom:calc(84px + var(--safe-b));z-index:5;padding-top:12px;background:linear-gradient(180deg,transparent,var(--bg) 35%)}

/* ---------- sheet / modal ---------- */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:640px;max-height:92vh;max-height:92dvh;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:26px 26px 0 0;padding:10px 20px calc(24px + var(--safe-b));animation:up .25s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:#3a423e;margin:4px auto 14px}
@keyframes up{from{transform:translateY(40px);opacity:0}} @keyframes fade{from{opacity:0}}
.ex-hero{border-radius:20px;background:#fff;overflow:hidden;aspect-ratio:1.25}
.ex-hero img{width:100%;height:100%;object-fit:contain}
ol.steps-list{margin:0;padding:0;list-style:none;counter-reset:s}
ol.steps-list li{counter-increment:s;display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
ol.steps-list li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--card2);color:var(--lime);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.timer-ring{--p:100;width:220px;height:220px;margin:10px auto;border-radius:50%;background:conic-gradient(var(--lime) calc(var(--p)*1%),var(--card2) 0);display:grid;place-items:center}
.timer-ring>div{width:190px;height:190px;border-radius:50%;background:var(--bg2);display:grid;place-items:center}
.timer-ring b{font-family:var(--display);font-size:64px;font-weight:800}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%);z-index:90;background:var(--text);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:fade .2s;max-width:90vw;text-align:center}
.chart{width:100%;height:170px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photos div{aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--card2);position:relative}
.photos img{width:100%;height:100%;object-fit:cover}
.photos span{position:absolute;left:6px;bottom:6px;font-size:11px;background:rgba(0,0,0,.6);padding:2px 6px;border-radius:6px}
.profile-hero{position:relative;border-radius:26px;overflow:hidden;min-height:220px;background:#000;padding:20px;display:flex;align-items:flex-end}
.profile-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 25%;opacity:.6}
.profile-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.85))}
.profile-hero>div{position:relative;z-index:1}
.switch{width:52px;height:30px;border-radius:99px;background:var(--card2);border:1px solid var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:all .2s}
.switch.on{background:var(--lime)} .switch.on::after{left:25px;background:var(--lime-ink)}
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.setting:last-child{border-bottom:0}

/* ---------- responsive: tablet ---------- */
@media (min-width:640px){
  .choice-grid{grid-template-columns:1fr 1fr}
  .choice{min-height:440px}
  .prog-grid{grid-template-columns:1fr 1fr}
  .ex-grid{grid-template-columns:repeat(3,1fr)}
  .stat-grid{grid-template-columns:repeat(4,1fr)}
  .photos{grid-template-columns:repeat(4,1fr)}
  .scrim{align-items:center}
  .sheet{border-radius:26px;max-height:88vh}
}
/* ---------- responsive: desktop ---------- */
@media (min-width:980px){
  .auth{grid-template-columns:1.15fr 1fr}
  .auth-hero{min-height:100vh}
  .auth-hero::after{background:linear-gradient(90deg,rgba(11,13,12,0) 55%,var(--bg) 100%),linear-gradient(180deg,rgba(0,0,0,0) 60%,rgba(0,0,0,.55))}
  .auth-hero .auth-panel{display:none}
  .auth-side{display:flex!important;align-items:center}
  .tabbar{display:none}
  .shell{display:grid;grid-template-columns:250px 1fr}

/* =========================================================
   DATE + PROGRAM HELPERS
   ========================================================= */
const DAY=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAYL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d);};
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const today=()=>iso(new Date());
const fmtDate=s=>{const d=parse(s);return `${DAY[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()].slice(0,3)}`;};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const active=()=>S.programs.find(p=>p.id===S.activeId)||null;
const totalWeeks=p=>p.phases.reduce((a,ph)=>a+(+ph.weeks||0),0)||p.weeks;
const endDate=p=>addDays(p.startDate,totalWeeks(p)*7-1);
function phaseIndexAt(p,date){
  const w=Math.floor(diffDays(p.startDate,date)/7); let acc=0;
  for(let i=0;i<p.phases.length;i++){acc+=+p.phases[i].weeks; if(w<acc) return i;}
  return p.phases.length-1;
}
function phaseStart(p,i){let acc=0;for(let k=0;k<i;k++)acc+=+p.phases[k].weeks;return addDays(p.startDate,acc*7);}
function inRange(p,date){return diffDays(p.startDate,date)>=0 && diffDays(date,endDate(p))>=0;}
function dayPlan(p,date){
  if(!inRange(p,date)) return null;
  const wd=parse(date).getDay();
  if(!p.days.includes(wd)) return {rest:true};
  const ph=p.phases[phaseIndexAt(p,date)];
  const d=ph.plan[wd]||{title:'Workout',tasks:[]};
  return {rest:false,title:d.title,tasks:d.tasks,phase:ph,phaseIdx:phaseIndexAt(p,date)};
}
function scheduled(p){const out=[];const n=totalWeeks(p)*7;for(let i=0;i<n;i++){const d=addDays(p.startDate,i);if(p.days.includes(parse(d).getDay()))out.push(d);}return out;}
const doneArr=(p,date)=>((S.done[p.id]||{})[date])||[];
function dayStatus(p,date){
  const pl=dayPlan(p,date); if(!pl) return 'out'; if(pl.rest) return 'rest';
  const n=pl.tasks.length, c=doneArr(p,date).filter(Boolean).length;
  if(n&&c>=n) return 'done'; if(c>0) return 'part';
  return diffDays(date,today())>0?'miss':'work';
}
function estMinutes(tasks){
  let s=0; for(const t of tasks){const e=EXMAP[t.ex]; if(!e) continue;
    if(e.unit==='min') s+=t.reps*60; else if(e.unit==='sec') s+=t.sets*(t.reps+45); else s+=t.sets*(t.reps*3+60);}
  return Math.max(5,Math.round(s/60/5)*5);
}
const fmtTask=t=>{const u=EXMAP[t.ex]?.unit; if(u==='min') return `${t.reps} minutes`; if(u==='sec') return `${t.sets} × ${t.reps} seconds`; return `${t.sets} sets × ${t.reps} reps`;};
function streak(p){
  if(!p) return 0; const t=today(); let s=0;
  const list=scheduled(p).filter(d=>diffDays(d,t)>=0).reverse();
  for(const d of list){const st=dayStatus(p,d); if(st==='done') s++; else if(d===t) continue; else break;}
  return s;
}
function bestStreak(p){let b=0,c=0;for(const d of scheduled(p)){if(diffDays(d,today())<0)break;if(dayStatus(p,d)==='done'){c++;b=Math.max(b,c);}else if(d!==today())c=0;}return b;}
function progressPct(p){const all=scheduled(p);if(!all.length)return 0;return Math.round(all.filter(d=>dayStatus(p,d)==='done').length/all.length*100);}
function phaseDone(p,i){const s=phaseStart(p,i),e=addDays(s,p.phases[i].weeks*7-1);const ds=scheduled(p).filter(d=>diffDays(s,d)>=0&&diffDays(d,e)>=0);return {total:ds.length,done:ds.filter(d=>dayStatus(p,d)==='done').length};}

/* =========================================================
   OPTIONAL ACCOUNTS — cloud backup + sync (Google Apps Script)
   Leave API_URL empty to hide accounts entirely.
   ========================================================= */
const API_URL='';
const LS_SESSION='ironday.session.v1';
let SESSION=null; try{SESSION=JSON.parse(localStorage.getItem(LS_SESSION)||'null');}catch(e){}
let SYNC={st:SESSION?'idle':'off',at:0,msg:''}, cloudT=null, cloudBusy=false, cloudAgain=false;
const accountsOn=()=>!!API_URL;
function setSession(v){SESSION=v;try{v?localStorage.setItem(LS_SESSION,JSON.stringify(v)):localStorage.removeItem(LS_SESSION);}catch(e){}}
async function api(action,data={}){
  const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...data})});
  if(!r.ok) throw new Error('Network error ('+r.status+')');
  return r.json();
}
function syncLabel(){
  if(!SESSION) return '';
  if(SYNC.st==='saving') return 'Syncing…';
  if(SYNC.st==='saved') return 'Backed up '+new Date(SYNC.at).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
  if(SYNC.st==='offline') return 'Offline: will back up when you’re online';
  if(SYNC.st==='error') return SYNC.msg||'Backup failed. Will retry';
  return 'Backup on';
}
function paintSync(){document.querySelectorAll('[data-sync]').forEach(el=>el.textContent=syncLabel());}
function cloudSave(){ if(!SESSION||!accountsOn()) return; clearTimeout(cloudT); cloudT=setTimeout(cloudPush,1500); }
async function cloudPush(){
  if(!SESSION) return; if(cloudBusy){cloudAgain=true;return;}
  cloudBusy=true; SYNC.st='saving'; paintSync();
  try{
    const r=await api('save',{token:SESSION.token,state:JSON.stringify(S),updated:S.updated});
    if(r.ok){SYNC={st:'saved',at:Date.now()};}
    else if(r.auth===false){signedOutBySever(r.error);}
    else SYNC={st:'error',msg:r.error};
  }catch(e){SYNC={st:'offline'};}
  cloudBusy=false; paintSync();
  if(cloudAgain){cloudAgain=false;cloudPush();}
}
function signedOutBySever(msg){setSession(null);SYNC={st:'off'};toast(msg||'Please sign in again');route();}
window.addEventListener('online',()=>{if(SESSION&&SYNC.st==='offline')cloudPush();});
async function cloudLoad(){
  if(!SESSION||!accountsOn()) return;
  try{
    const r=await api('load',{token:SESSION.token});
    if(!r.ok){ if(r.auth===false) signedOutBySever(r.error); return; }
    if(r.state && (r.updated||0)>(S.updated||0)){ S=Object.assign(blank(),r.state); try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){} SYNC={st:'saved',at:Date.now()}; route(); }
    else if((S.updated||0)>(r.updated||0)) cloudPush();
    else { SYNC={st:'saved',at:Date.now()}; paintSync(); }
  }catch(e){ SYNC={st:'offline'}; paintSync(); }
}
// After signing in: use the cloud copy if it has data, otherwise keep this device's data and upload it.
function adoptCloud(r){
  const user={...(S.user||{}),name:r.user.name,email:r.user.email};
  if(r.state && (r.state.programs?.length || r.state.history?.length || r.state.weights?.length)){
    S=Object.assign(blank(),r.state); S.user=Object.assign({goal:'Build muscle',level:'Beginner',joined:today()},r.state.user||{},{email:r.user.email});
  }else{
    S.user=Object.assign({goal:'Build muscle',level:'Beginner',joined:today()},user);
  }
  setSession({token:r.token,email:r.user.email});
  SYNC={st:'saved',at:Date.now()}; save();
}

async function submitAuth(f,after){
  const fd=new FormData(f), mode=f.dataset.mode, err=f.querySelector('[data-err]'), btn=f.querySelector('button[type=submit]');
  if(mode==='guest'){const name=String(fd.get('name')||'').trim();if(!name)return;

      :{name:fd.get('name'),email:fd.get('email'),password:fd.get('password'),consent:!!fd.get('consent'),state:JSON.stringify({...S,user:{...(S.user||{}),name:String(fd.get('name')||'').trim(),email:String(fd.get('email')||'').trim(),goal:S.user?.goal||'Build muscle',level:S.user?.level||'Beginner',joined:S.user?.joined||today()}}),updated:Date.now()};

let AFTER=[];
function afterHome(fn){AFTER.push(fn);return '';}
const _route=route;
route=function(){AFTER=[];_route();const t=document.getElementById('timerBtn');t&&(t.onclick=()=>openTimer());AFTER.forEach(f=>f());AFTER=[];};

function taskList(p,date,pl,readOnly){
  const arr=doneArr(p,date); const n=pl.tasks.length; const c=arr.filter(Boolean).length;
  return `<div class="card card-tight" data-tasks="${date}">
    <div class="row between" style="padding:4px 4px 12px"><div><h3>${esc(pl.title)}</h3><p class="small muted">${c} of ${n} completed · ~${estMinutes(pl.tasks)} min</p></div><span class="badge ${c===n&&n?'':'gray'}">${n?Math.round(c/n*100):0}%</span></div>
    <div class="bar" style="margin:0 4px 14px"><i style="width:${n?c/n*100:0}%"></i></div>
    ${pl.tasks.map((t,i)=>`<div class="task ${arr[i]?'done':''}">
       <div data-ex="${t.ex}" data-task='${JSON.stringify(t)}' style="cursor:pointer">${thumb(t.ex)}</div>
       <div class="tmain" data-ex="${t.ex}" data-task='${JSON.stringify(t)}'><div class="tname">${esc(EXMAP[t.ex]?.n||t.ex)}</div><div class="tmeta">${fmtTask(t)}</div></div>
       ${readOnly?'':`<button class="check" data-check="${i}" aria-label="Mark done">${I.check}</button>`}</div>`).join('')}
    ${readOnly?'':`<button class="btn ${c===n?'btn-ghost':'btn-lime'} btn-block" style="margin-top:14px" data-all>${c===n?'Workout completed ✓':'Complete Today’s Workout'}</button>`}
  </div>`;
}
function setDone(p,date,i,val){
  S.done[p.id]=S.done[p.id]||{}; const pl=dayPlan(p,date);
  const arr=(S.done[p.id][date]||Array(pl.tasks.length).fill(false)).slice(0,pl.tasks.length);
  while(arr.length<pl.tasks.length)arr.push(false);
  if(i==='all') arr.fill(val); else arr[i]=val;
  S.done[p.id][date]=arr;
  const complete=arr.every(Boolean);
  S.history=S.history.filter(h=>!(h.pid===p.id&&h.date===date));
  if(arr.some(Boolean)) S.history.push({pid:p.id,date,name:p.name,title:pl.title,done:arr.filter(Boolean).length,total:arr.length,min:estMinutes(pl.tasks)});
  save(); return complete;
}
function wireTasks(p,date,rerender){
  document.querySelectorAll(`[data-tasks="${date}"]`).forEach(box=>{
    box.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{const i=+b.dataset.check;const was=doneArr(p,date)[i];const complete=setDone(p,date,i,!was);if(complete&&!was)toast('Workout complete! 🔥 Great job.');else if(!was)toast('Nice! Set done.');(rerender||route)();});
    const all=box.querySelector('[data-all]'); all&&(all.onclick=()=>{const arr=doneArr(p,date);const pl=dayPlan(p,date);const allDone=arr.length===pl.tasks.length&&arr.every(Boolean);setDone(p,date,'all',!allDone);toast(allDone?'Marked as not done':'Workout complete! 🔥 Great job.');(rerender||route)();});
  });
}

let TIMER=null;
function stopTimer(){if(TIMER){clearInterval(TIMER.i);TIMER=null;}}
function beep(){try{const C=window.AudioContext||window.webkitAudioContext;const c=new C();[0,.25,.5].forEach(o=>{const g=c.createGain(),os=c.createOscillator();os.frequency.value=880;os.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.2,c.currentTime+o);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+o+.2);os.start(c.currentTime+o);os.stop(c.currentTime+o+.22);});}catch(e){}}
function openTimer(sec){
  sec=sec||S.settings.rest;
  const s=sheet(`<div class="row between"><h2>Rest timer</h2><button class="icon-btn" data-x>${I.x}</button></div>
    <div class="timer-ring" id="tr"><div><b id="tv">${sec}</b></div></div>
    <div class="chips" style="justify-content:center;margin:8px 0 16px">${[30,60,90,120,180].map(v=>`<button class="chip ${v===sec?'on':''}" data-v="${v}">${v<60?v+'s':v/60+(v%60?'.5':'')+' min'}</button>`).join('')}</div>
    <div class="grid2"><button class="btn btn-ghost" data-reset>Reset</button><button class="btn btn-lime" data-go2>Start</button></div>`);
  let total=sec,left=sec,running=false;
  const tv=s.querySelector('#tv'),tr=s.querySelector('#tr'),gb=s.querySelector('[data-go2]');
  const paint=()=>{tv.textContent=left>=60?`${Math.floor(left/60)}:${pad(left%60)}`:left;tr.style.setProperty('--p',left/total*100);};
  const stop=()=>{stopTimer();running=false;gb.textContent='Start';};
  gb.onclick=()=>{if(running){stop();return;}running=true;gb.textContent='Pause';stopTimer();
    TIMER={i:setInterval(()=>{left--;paint();if(left<=0){stop();beep();tv.textContent='GO!';left=total;}},1000)};};
  s.querySelector('[data-reset]').onclick=()=>{stop();left=total;paint();};
  s.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{stop();total=left=+b.dataset.v;S.settings.rest=total;save();s.querySelectorAll('[data-v]').forEach(x=>x.classList.toggle('on',x===b));paint();});
  s.querySelector('[data-x]').onclick=closeSheet; paint();
}

let CAL={month:null,sel:null};
function renderSchedule(){

  const t=today(); CAL.sel=CAL.sel||t;
  const m=CAL.month||t.slice(0,7)+'-01'; CAL.month=m;
  const md=parse(m), first=new Date(md.getFullYear(),md.getMonth(),1), startOff=(first.getDay()+6)%7, dim=new Date(md.getFullYear(),md.getMonth()+1,0).getDate();
  let cells=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="h">${d.slice(0,2)}</div>`).join('');
  for(let i=0;i<startOff;i++)cells+='<div class="cd out"></div>';
  for(let d=1;d<=dim;d++){const ds=iso(new Date(md.getFullYear(),md.getMonth(),d));const st=dayStatus(p,ds);
    cells+=`<div class="cd ${st} ${ds===t?'today':''} ${ds===CAL.sel?'sel':''}" data-day="${ds}">${d}${st==='rest'?'<em>REST</em>':''}</div>`;}
  // week strip
  const mondayOff=(parse(CAL.sel).getDay()+6)%7, wkStart=addDays(CAL.sel,-mondayOff);
  const strip=[...Array(7)].map((_,i)=>{const ds=addDays(wkStart,i);const st=dayStatus(p,ds);const col={done:'var(--lime)',part:'var(--lime-d)',miss:'var(--red)',work:'#5c6560',rest:'transparent',out:'transparent'}[st];
    return `<div class="wd ${ds===CAL.sel?'sel':''}" data-day="${ds}"><small>${DAY[parse(ds).getDay()]}</small><b>${parse(ds).getDate()}</b><i style="background:${ds===CAL.sel?'var(--lime-ink)':col}"></i></div>`;}).join('');
  const pl=dayPlan(p,CAL.sel);
  let detail;
  if(!pl) detail=`<div class="card"><p class="muted">Outside your program dates (${fmtDate(p.startDate)} – ${fmtDate(endDate(p))}).</p></div>`;
  else if(pl.rest) detail=`<div class="card rest-card"><div class="big">😴</div><h3 style="margin-top:8px">Rest day</h3><p class="muted small">Scheduled recovery — no training today.</p></div>`;
  else detail=`<p class="small muted" style="margin-bottom:8px">${fmtDate(CAL.sel)} · Phase ${pl.phaseIdx+1} · ${esc(pl.phase.name)}</p>`+taskList(p,CAL.sel,pl,diffDays(CAL.sel,t)<0).replace('Complete Today’s Workout',CAL.sel===t?'Complete Today’s Workout':'Mark Workout Complete');
  return `<div class="topbar"><h1>Schedule</h1><span class="badge">${esc(p.name)}</span></div>
   <div class="two-col"><div class="stack">
     <div class="week-strip">${strip}</div>
     <div class="card"><div class="row between" style="margin-bottom:14px"><button class="icon-btn" data-mon="-1">${I.back}</button><h3>${MON[md.getMonth()]} ${md.getFullYear()}</h3><button class="icon-btn" data-mon="1" style="transform:scaleX(-1)">${I.back}</button></div>
       <div class="cal">${cells}</div>
       <div class="legend"><span><i style="background:var(--lime)"></i>Done</span><span><i style="background:rgba(200,244,58,.25)"></i>Partial</span><span><i style="border:1px solid #3a423e"></i>Workout</span><span><i style="border:1px solid var(--red)"></i>Missed</span><span><i style="background:var(--card)"></i>Rest</span></div></div>
   </div><div>${detail}</div></div>`+afterHome(()=>{
    document.querySelectorAll('[data-day]').forEach(c=>c.onclick=()=>{CAL.sel=c.dataset.day;route();});

function programFromTemplate(r){return {id:uid(),name:r.name,goal:r.goal,level:r.level,source:'ready',tid:r.tid,img:r.img,days:[...r.days],weeks:r.weeks,startDate:today(),status:'saved',created:Date.now(),
  phases:JSON.parse(JSON.stringify(r.phases))};}
function activate(p){S.programs.forEach(x=>{if(x.status==='active'&&x.id!==p.id)x.status='saved';});p.status='active';S.activeId=p.id;save();}
function resumeProgram(p){const away=Math.max(0,diffDays(p.pausedAt||today(),today()));
  if(away){const moved={};for(const[d,v] of Object.entries(S.done[p.id]||{})){if(diffDays(d,p.pausedAt)>0)moved[d]=v;else moved[addDays(d,away)]=v;}S.done[p.id]=moved;p.startDate=addDays(p.startDate,away);}
  p.status='active';delete p.pausedAt;save();toast('Program resumed');route();}

  phases:[{name:'Beginner Foundation',weeks:4,plan:{}}],_step:1,_ph:0,_day:1};}

        <div class="grid2"><label class="field"><span>Weeks</span><input class="input" type="number" min="1" max="26" data-pw="${i}" value="${ph.weeks}"></label>
        <label class="field"><span>Difficulty</span><select class="input" data-pdf="${i}">${['Easy','Moderate','Hard','Advanced'].map(x=>`<option ${x===(ph.diff||'Moderate')?'selected':''}>${x}</option>`).join('')}</select></label></div></div>
        ${d.phases.length>1?`<button class="icon-btn" data-prm="${i}">${I.trash}</button>`:''}</div>`).join('')}
      <button class="btn btn-ghost btn-block" id="addPh">${I.plus.replace('<svg','<svg width="18" height="18"')} Add phase</button>
      <p class="small muted">Total: <b class="lime">${d.phases.reduce((a,p)=>a+(+p.weeks||0),0)} weeks</b>. New phases copy the exercises from the phase before, so you only adjust what changes.</p></div>`;
  }else{

      ${d.phases.length>1?`<div class="chips">${d.phases.map((p,i)=>`<button class="chip ${i===d._ph?'on':''}" data-sph="${i}">Phase ${i+1} · ${esc(p.name)}</button>`).join('')}</div>`:''}
      <div class="chips">${[1,2,3,4,5,6,0].filter(w=>d.days.includes(w)).map(w=>{const n=(ph.plan[w]?.tasks||[]).length;return `<button class="chip ${w===d._day?'on':''}" data-sd="${w}">${DAY[w]}${n?' · '+n:''}</button>`;}).join('')}</div>

  return head+body+foot+afterHome(()=>wireCreate());

function wireCreate(){
  const d=DRAFT,st=d._step,$=id=>document.getElementById(id);
  const keep=()=>{ if(st===1){d.name=$('fName').value;d.goal=$('fGoal').value;d.level=$('fLevel').value;d.startDate=$('fStart').value||today();}
    if(st===2){document.querySelectorAll('[data-pn]').forEach(i=>d.phases[+i.dataset.pn].name=i.value);document.querySelectorAll('[data-pw]').forEach(i=>d.phases[+i.dataset.pw].weeks=Math.max(1,Math.min(26,+i.value||1)));document.querySelectorAll('[data-pdf]').forEach(i=>d.phases[+i.dataset.pdf].diff=i.value);syncWeeks(d);}
    if(st===3){const dd=d.phases[d._ph].plan[d._day];if(dd){dd.title=$('dTitle').value;document.querySelectorAll('[data-ts]').forEach(i=>dd.tasks[+i.dataset.ts].sets=Math.max(1,+i.value||1));document.querySelectorAll('[data-tr]').forEach(i=>dd.tasks[+i.dataset.tr].reps=Math.max(1,+i.value||1));}}};
  $('cBack').onclick=()=>{keep();confirmSheet('Leave builder?','Your unsaved changes will be lost.','Leave',()=>{DRAFT=null;go(S.programs.length?'workouts':'choose');});};
  $('cPrev')&&($('cPrev').onclick=()=>{keep();d._step--;route();});
  document.querySelectorAll('[data-wd]').forEach(b=>b.onclick=()=>{keep();const w=+b.dataset.wd;d.days=d.days.includes(w)?d.days.filter(x=>x!==w):[...d.days,w];route();});
  $('addPh')&&($('addPh').onclick=()=>{keep();const last=d.phases[d.phases.length-1];const names=['Beginner Foundation','Strength Building','Fat Loss','Advanced Training'];d.phases.push({name:names[d.phases.length]||'Phase '+(d.phases.length+1),weeks:2,diff:'Hard',plan:JSON.parse(JSON.stringify(last.plan))});route();});
  document.querySelectorAll('[data-prm]').forEach(b=>b.onclick=()=>{keep();d.phases.splice(+b.dataset.prm,1);route();});
  document.querySelectorAll('[data-sph]').forEach(b=>b.onclick=()=>{keep();d._ph=+b.dataset.sph;route();});
  document.querySelectorAll('[data-sd]').forEach(b=>b.onclick=()=>{keep();d._day=+b.dataset.sd;route();});
  document.querySelectorAll('[data-trm]').forEach(b=>b.onclick=()=>{keep();d.phases[d._ph].plan[d._day].tasks.splice(+b.dataset.trm,1);route();});
  $('addEx')&&($('addEx').onclick=()=>{keep();pickExercise(ex=>{const e=EXMAP[ex];d.phases[d._ph].plan[d._day].tasks.push({ex,sets:e.sets,reps:e.reps});route();});});
  $('copyDay')&&($('copyDay').onclick=()=>{keep();const src=d.phases[d._ph].plan[d._day];
    sheet(`<h2>Copy ${DAYL[d._day]} to…</h2><p class="muted small" style="margin:6px 0 14px">Replaces the exercises on the days you pick${d.phases.length>1?', in every phase':''}.</p>
     <div class="daypick">${[1,2,3,4,5,6,0].filter(w=>d.days.includes(w)&&w!==d._day).map(w=>`<button data-cp="${w}">${DAY[w]}</button>`).join('')}</div>
     <button class="btn btn-lime btn-block" style="margin-top:16px" id="doCopy">Copy</button>`,s=>{
       s.querySelectorAll('[data-cp]').forEach(b=>b.onclick=()=>b.classList.toggle('on'));
       s.querySelector('#doCopy').onclick=()=>{const ws=[...s.querySelectorAll('[data-cp].on')].map(b=>+b.dataset.cp);d.phases.forEach(ph=>ws.forEach(w=>ph.plan[w]=JSON.parse(JSON.stringify(src))));closeSheet();toast(ws.length?`Copied to ${ws.length} day(s)`:'No days picked');route();};});});
  const finish=(start)=>{
    keep(); d.name=d.name.trim()||'My Custom Workout'; syncWeeks(d);
    d.phases.forEach(ph=>{for(const w of Object.keys(ph.plan)) if(!d.days.includes(+w)) delete ph.plan[w]; d.days.forEach(w=>{ph.plan[w]=ph.plan[w]||{title:'Workout',tasks:[]};if(!ph.plan[w].title)ph.plan[w].title=DAYL[w]+' Workout';});});
    const clean=JSON.parse(JSON.stringify(d)); const editing=clean._editing; ['_step','_ph','_day','_editing'].forEach(k=>delete clean[k]);
    if(editing){const i=S.programs.findIndex(x=>x.id===editing);clean.status=S.programs[i].status;S.programs[i]=clean;save();DRAFT=null;toast('Program updated');go('workouts');return;}
    S.programs.push(clean); if(start) activate(clean); S.lastType='custom'; save(); DRAFT=null;
    toast(start?'Program created — let’s go!':'Saved for later'); go(start?'home':'workouts');
  };
  $('cNext').onclick=()=>{keep();
    if(st===1){if(!d.days.length){toast('Pick at least one workout day');return;}d._step=2;route();return;}
    if(st===2){d._step=3;d._ph=0;d._day=d.days.includes(d._day)?d._day:d.days[0];route();return;}
    const empty=d.phases.some(ph=>d.days.some(w=>!(ph.plan[w]?.tasks||[]).length));
    if(empty) confirmSheet('Some days have no exercises','Those days will show as empty workouts. Save anyway?','Save anyway',()=>finish(!d._editing)); else finish(!d._editing);
  };
  $('cSaveOnly')&&($('cSaveOnly').onclick=()=>finish(false));
}
function pickExercise(cb){

    s.querySelector('#pkList').innerHTML=EXERCISES.filter(e=>e.g===g).map(e=>`<button class="list-item" data-pick="${e.id}">${thumb(e.id)}<div style="flex:1"><b>${esc(e.n)}</b><p class="small muted">${esc(e.muscles)}</p></div><span class="lime">${I.plus.replace('<svg','<svg width="22" height="22"')}</span></button>`).join('');

  sheet(`<div class="row between" style="margin-bottom:12px"><h2>Add exercise</h2><button class="icon-btn" data-x>${I.x}</button></div><div class="chips" id="pkChips" style="margin-bottom:12px"></div><div id="pkList"></div>`,s=>{s.querySelector('[data-x]').onclick=closeSheet;draw(s);});

function renderLibrary(){
  const g=GROUPS.find(x=>x.id===VIEW.g)||GROUPS[0];
  const list=EXERCISES.filter(e=>e.g===g.id);
  return `<div class="topbar"><div class="row"><button class="icon-btn" data-go="${S.programs.length?'workouts':'choose'}">${I.back}</button><h1 style="font-size:34px">Exercise Library</h1></div></div>
   <div class="chips" style="margin-bottom:14px">${GROUPS.map(x=>`<button class="chip ${x.id===g.id?'on':''}" data-go="library" data-p='{"g":"${x.id}"}'>${x.n}</button>`).join('')}</div>
   <div class="group-hero">${g.map?`<div class="map"><img src="${g.map}" alt="${g.n} muscles"></div>`:`<div class="map" style="background:var(--card2);display:grid;place-items:center;color:var(--lime)">${I.stretch.replace('<svg','<svg width="44" height="44"')}</div>`}
     <div><span class="badge">${list.length} exercises</span><h2 style="margin-top:8px">${g.n}</h2><p class="small muted" style="margin-top:4px">${g.d}</p></div></div>
   <div class="ex-grid">${list.map(e=>`<button class="ex-card" data-ex="${e.id}">${e.img?`<div class="img"><img src="${e.img}" alt="${esc(e.n)}" loading="lazy"></div>`:`<div class="img" style="background:var(--card2);display:grid;place-items:center;color:var(--lime)">${I.stretch.replace('<svg','<svg width="48" height="48"')}</div>`}
     <div class="body"><b>${esc(e.n)}</b><span>${e.unit==='sec'?`${e.sets} × ${e.reps}s`:e.unit==='min'?`${e.reps} min`:`${e.sets} × ${e.reps}`} · tap for steps</span></div></button>`).join('')}</div>`;
}

/* =========================================================
   PROGRESS
   ========================================================= */
function renderProgress(){
  const p=active();
  const totalDone=S.history.filter(h=>h.done===h.total).length;
  const mins=S.history.filter(h=>h.done===h.total).reduce((a,h)=>a+(h.min||0),0);
  const ws=[...S.weights].sort((a,b)=>a.d<b.d?-1:1);
  const chart=(()=>{if(ws.length<2)return `<p class="muted small" style="padding:20px 0">Log at least two weights to see your trend.</p>`;
    const W=600,H=170,P=26,vals=ws.map(w=>w.kg),mn=Math.min(...vals)-1,mx=Math.max(...vals)+1;
    const x=i=>P+i*(W-2*P)/(ws.length-1),y=v=>H-P-(v-mn)/(mx-mn)*(H-2*P);
    const pts=ws.map((w,i)=>`${x(i)},${y(w.kg)}`).join(' ');
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline points="${P},${H-P} ${pts} ${W-P},${H-P}" fill="rgba(200,244,58,.08)" stroke="none"/><polyline points="${pts}" fill="none" stroke="var(--lime)" stroke-width="3" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>${ws.map((w,i)=>`<circle cx="${x(i)}" cy="${y(w.kg)}" r="4" fill="var(--lime)"/>`).join('')}</svg>
     <div class="row between tiny muted"><span>${fmtDate(ws[0].d)} · ${ws[0].kg} kg</span><span>${fmtDate(ws[ws.length-1].d)} · ${ws[ws.length-1].kg} kg</span></div>`;})();
  const change=ws.length>1?(ws[ws.length-1].kg-ws[0].kg).toFixed(1):null;
  const phases=p?p.phases.map((ph,i)=>{const pd=phaseDone(p,i),s=phaseStart(p,i),unlocked=diffDays(s,today())>=0,cur=unlocked&&phaseIndexAt(p,today())===i&&diffDays(today(),endDate(p))>=0,complete=pd.total&&pd.done===pd.total;
    return `<div class="phase ${cur?'cur':''} ${unlocked?'':'lock'}"><div class="num">${unlocked?i+1:I.lock.replace('<svg','<svg width="18" height="18"')}</div><div style="flex:1"><div class="row between"><b>${esc(ph.name)}</b>${complete?'<span class="badge">Complete</span>':cur?'<span class="badge amber">In progress</span>':unlocked?'<span class="badge gray">Finished</span>':'<span class="badge gray">Locked</span>'}</div>
     <p class="small muted">${ph.weeks} weeks · ${unlocked?`${pd.done}/${pd.total} workouts`:'Unlocks '+fmtDate(s)}</p>${unlocked?`<div class="bar" style="margin-top:8px"><i style="width:${pd.total?pd.done/pd.total*100:0}%"></i></div>`:''}</div></div>`;}).join(''):'';
  const hist=[...S.history].sort((a,b)=>a.date<b.date?1:-1).slice(0,12);
  return `<div class="topbar"><h1>Progress</h1></div>
   <div class="stat-grid"><div class="stat"><b>${totalDone}</b><span>Workouts completed</span></div><div class="stat"><b>${streak(p)}</b><span>Current streak</span></div><div class="stat"><b>${p?bestStreak(p):0}</b><span>Best streak</span></div><div class="stat"><b>${mins}</b><span>Minutes trained</span></div></div>
   <div class="two-col" style="margin-top:18px"><div>
     ${p?`<div class="section-h" style="margin-top:0"><h3>Phase completion</h3><span class="muted small">${progressPct(p)}% of program</span></div>${phases}`:''}
     <div class="section-h"><h3>Weight tracker</h3>${change!==null?`<span class="badge ${change<=0?'':'amber'}">${change>0?'+':''}${change} kg</span>`:''}</div>
     <div class="card"><form id="wForm" class="row"><input class="input" type="number" step="0.1" min="20" max="400" id="wIn" placeholder="Today’s weight (kg)" required><button class="btn btn-lime" type="submit">Log</button></form><div style="margin-top:14px">${chart}</div></div>
   </div><div>
     <div class="section-h" style="margin-top:0"><h3>Progress photos</h3><label class="link">+ Add photo<input type="file" accept="image/*" id="phIn" hidden></label></div>
     <div class="card">${PHOTOS.length?`<div class="photos">${PHOTOS.map((ph,i)=>`<div data-phi="${i}"><img src="${ph.src}" alt="Progress photo ${fmtDate(ph.d)}"><span>${fmtDate(ph.d)}</span></div>`).join('')}</div>`:`<div class="row" style="gap:14px"><div class="thumb" style="width:72px;height:96px"><img src="img/mirror.jpg" alt="" style="object-position:center 20%"></div><p class="small muted">Take a photo every week in the same spot and lighting to compare your progress. Photos stay on this device.</p></div>`}</div>
     <div class="section-h"><h3>Workout history</h3></div>
     ${hist.length?hist.map(h=>`<div class="list-item"><div class="check" style="${h.done===h.total?'background:var(--lime);border-color:var(--lime);color:var(--lime-ink)':''}">${h.done===h.total?I.check.replace('<svg','<svg style="opacity:1"'):''}</div><div style="flex:1"><b>${esc(h.title)}</b><p class="small muted">${fmtDate(h.date)} · ${esc(h.name)}</p></div><span class="small ${h.done===h.total?'lime':'muted'}">${h.done}/${h.total}</span></div>`).join(''):'<p class="muted small">Completed sessions will show here.</p>'}
   </div></div>`+afterHome(()=>{
    document.getElementById('wForm').onsubmit=e=>{e.preventDefault();const v=+document.getElementById('wIn').value;if(!v)return;S.weights=S.weights.filter(w=>w.d!==today());S.weights.push({d:today(),kg:Math.round(v*10)/10});save();toast('Weight logged');route();};
    document.getElementById('phIn').onchange=e=>{const f=e.target.files[0];if(!f)return;const img=new Image();img.onload=()=>{const c=document.createElement('canvas');const s=Math.min(1,480/img.width);c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);PHOTOS.unshift({d:today(),src:c.toDataURL('image/jpeg',.72)});savePhotos();URL.revokeObjectURL(img.src);route();};img.src=URL.createObjectURL(f);};
    document.querySelectorAll('[data-phi]').forEach(el=>el.onclick=()=>{const i=+el.dataset.phi;sheet(`<img src="${PHOTOS[i].src}" style="width:100%;border-radius:18px"><p class="muted" style="margin:10px 0">${fmtDate(PHOTOS[i].d)}</p><button class="btn btn-danger btn-block" id="delPh">Delete photo</button>`,s=>s.querySelector('#delPh').onclick=()=>{PHOTOS.splice(i,1);savePhotos();closeSheet();route();});});
  });
}

/* =========================================================
   PROFILE
   ========================================================= */
function renderProfile(){
  const u=S.user;
  return `<div class="topbar"><h1>Profile</h1></div>
   <div class="two-col"><div class="stack">
    <div class="profile-hero"><img src="img/mirror.jpg" alt=""><div><span class="badge">${esc(u.level)}</span><h1 style="margin-top:8px">${esc(u.name)}</h1><p class="small" style="color:#cfd6d2">Goal: ${esc(u.goal)} · Member since ${fmtDate(u.joined||today())}</p></div></div>
    <div class="card stack"><h3>Personal details</h3>
     <label class="field"><span>Name</span><input class="input" id="pName" value="${esc(u.name)}"></label>
     <label class="field"><span>Email</span><input class="input" type="email" id="pEmail" value="${esc(u.email||'')}"></label>
     <div class="grid2"><label class="field"><span>Fitness goal</span><select class="input" id="pGoal">${['Build muscle','Lose fat','Get stronger','General fitness','Flexibility'].map(g=>`<option ${g===u.goal?'selected':''}>${g}</option>`).join('')}</select></label>
     <label class="field"><span>Level</span><select class="input" id="pLevel">${['Beginner','Intermediate','Advanced'].map(g=>`<option ${g===u.level?'selected':''}>${g}</option>`).join('')}</select></label></div>
     <button class="btn btn-lime" id="pSave">Save details</button></div>
   </div><div class="stack">
    <div class="card"><h3>Fitness settings</h3>
     <div class="setting"><div><b>Daily reminder</b><p class="small muted">Shows a reminder on Home if today’s workout isn’t done by this time.</p></div><button class="switch ${S.settings.reminder?'on':''}" id="pRem" aria-label="Toggle reminder"></button></div>
     <div class="setting"><b>Reminder time</b><input class="input" type="time" id="pTime" value="${S.settings.remindAt}" style="width:140px"></div>
     <div class="setting"><b>Default rest timer</b><select class="input" id="pRest" style="width:140px">${[30,60,90,120,180].map(v=>`<option value="${v}" ${v===S.settings.rest?'selected':''}>${v} seconds</option>`).join('')}</select></div>
     <div class="setting"><div><b>Preferred start</b><p class="small muted">Remembered from your last choice.</p></div><span class="badge gray">${S.lastType==='custom'?'Create your own':S.lastType==='ready'?'Ready-made':'—'}</span></div>
    </div>
    ${accountCard()}
    ${installCard()}
    <div class="card"><h3>${SESSION?'This device':'Account'}</h3>
     <div class="setting"><b>Programs saved</b><span>${S.programs.length}</span></div>
     <div class="setting"><b>Sign out</b><button class="btn btn-ghost btn-sm" id="pOut">Sign out</button></div>
     <div class="setting"><div><b>Reset all data</b><p class="small muted">Deletes programs, progress and history${SESSION?', including your online backup':''}.</p></div><button class="btn btn-danger btn-sm" id="pReset">Reset</button></div>
     <div class="setting"><b>Privacy policy</b><a class="link" href="privacy.html">Read</a></div>
    </div></div></div>`+afterHome(()=>{
    const $=id=>document.getElementById(id);
    $('pInstall')&&($('pInstall').onclick=async()=>{if(!INSTALL_EVT)return;INSTALL_EVT.prompt();try{await INSTALL_EVT.userChoice;}catch(e){}INSTALL_EVT=null;route();});
    $('pSave').onclick=()=>{u.name=$('pName').value.trim()||u.name;u.email=$('pEmail').value.trim();u.goal=$('pGoal').value;u.level=$('pLevel').value;save();toast('Profile saved');route();};
    $('pRem').onclick=()=>{S.settings.reminder=!S.settings.reminder;save();route();};
    $('pTime').onchange=e=>{S.settings.remindAt=e.target.value||'18:00';save();toast('Reminder time saved');};
    $('pRest').onchange=e=>{S.settings.rest=+e.target.value;save();toast('Rest timer updated');};
    wireAccount();
    $('pOut').onclick=()=>SESSION
      ?confirmSheet('Sign out?','Your data is backed up to your account. Signing out removes it from this device; sign in again any time to get it back. Progress photos are only stored on this device and will be removed.','Sign out',async()=>{try{clearTimeout(cloudT);await cloudPush();api('logout',{token:SESSION.token}).catch(()=>{});}catch(e){}setSession(null);SYNC={st:'off'};S=blank();PHOTOS=[];savePhotos();try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}AUTH_MODE='login';route();})
      :confirmSheet('Sign out?','You don’t have an account, so your programs and progress stay on this device for when you come back.','Sign out',()=>{S.user=null;save();route();});
    $('pReset').onclick=()=>confirmSheet('Reset everything?','This permanently deletes all programs, completed tasks, weights and history.','Reset',()=>{const keep=S.user;S=blank();S.user=keep;PHOTOS=[];savePhotos();save();go('choose');},true);
  });
}

/* ---------- install as an app (PWA) ---------- */
let INSTALL_EVT=null;
const STANDALONE=()=>{try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;}catch(e){return false;}};
const IS_IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();INSTALL_EVT=e;if(VIEW.name==='profile')route();});
window.addEventListener('appinstalled',()=>{INSTALL_EVT=null;toast('IRONDAY installed!');});
const NATIVE=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
const APK_URL='https://github.com/jaycee055/ironday/releases/latest/download/IRONDAY.apk';
function installCard(){
  if(NATIVE||STANDALONE()) return '';
  const apk=(!IS_IOS&&/Android/i.test(navigator.userAgent))?`<a class="btn btn-ghost btn-block" style="margin-top:10px" href="${APK_URL}">Download the Android app (APK)</a>`:'';
  if(INSTALL_EVT) return `<div class="card"><h3>Install the app</h3><p class="small muted" style="margin:6px 0 12px">Add IRONDAY to your home screen. It opens full-screen and works offline.</p><button class="btn btn-lime btn-block" id="pInstall">Install IRONDAY</button>${apk}</div>`;
  if(apk) return `<div class="card"><h3>Get the Android app</h3><p class="small muted" style="margin:6px 0 4px">Install IRONDAY as an app on your phone.</p>${apk}</div>`;
  if(INSTALL_EVT) return `<div class="card"><h3>Install the app</h3><p class="small muted" style="margin:6px 0 12px">Add IRONDAY to your home screen. It opens full-screen and works offline.</p><button class="btn btn-lime btn-block" id="pInstall">Install IRONDAY</button></div>`;
  if(IS_IOS) return `<div class="card"><h3>Add to Home Screen</h3><p class="small muted" style="margin-top:6px">In Safari, tap the <b>Share</b> button, then <b>Add to Home Screen</b>. IRONDAY will open full-screen and work offline.</p></div>`;
  return '';
}
if(!NATIVE && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !/claude\.(ai|site)|claudeusercontent|anthropic/.test(location.hostname)){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

/* ---------- Android back button (native app) ---------- */
if(NATIVE){try{const App=window.Capacitor.Plugins.App;App&&App.addListener('backButton',()=>{
  if(document.querySelector('.scrim')){closeSheet();return;}
  if(!S.user||VIEW.name==='home'||(VIEW.name==='choose'&&!S.programs.length)){App.exitApp();return;}
  if(VIEW.name==='readyDetail'){go('ready');return;}
  if(['ready','create','library','choose'].includes(VIEW.name)){go(S.programs.length?'workouts':'choose');return;}
  go('home');});}catch(e){}}

/* ---------- boot ---------- */
(function boot(){const h=location.hash.slice(1);VIEW={name:TABS.some(t=>t[0]===h)?h:'home'};route();if(SESSION)cloudLoad();})();
</script>
</body>
